<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Year Progress</title>
  <meta name="description" content="Track the progress of 2026." />
  <meta name="keywords"
    content="2026 Progress, Year Progress, HSC 2026, HSC Countdown, HSC '26, Time Tracker, Motivation, Year Percentage, Live Countdown, Fahim Foysal" />
  <meta name="author" content="Fahim Foysal" />

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
</head>

<body>
  <!-- Custom Cursor Element -->
  <div class="custom-cursor" id="custom-cursor"></div>

  <!-- Settings Button -->
  <button id="settings-btn" class="settings-btn" aria-label="Settings">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
      </path>
    </svg>
  </button>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label for="precision-input">Decimal Precision</label>
          <div class="input-wrapper">
            <input type="number" id="precision-input" min="0" max="12" value="6">
            <span class="input-hint">Default: 6</span>
          </div>
        </div>
        <div class="setting-item">
          <label for="color-picker">Theme Color</label>
          <div class="color-options">
            <button class="color-swatch" data-color="#00ff66" style="background-color: #00ff66;"
              aria-label="Green"></button>
            <button class="color-swatch" data-color="#3b82f6" style="background-color: #3b82f6;"
              aria-label="Blue"></button>
            <button class="color-swatch" data-color="#ff0055" style="background-color: #ff0055;"
              aria-label="Pink"></button>
            <button class="color-swatch" data-color="#a855f7" style="background-color: #a855f7;"
              aria-label="Purple"></button>
            <button class="color-swatch" data-color="#f59e0b" style="background-color: #f59e0b;"
              aria-label="Orange"></button>

            <div class="custom-color-wrapper" title="Custom Color">
              <input type="color" id="custom-color-picker" value="#00ff66">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 22h20"></path>
                <path
                  d="M10.29 2.22a2.22 2.22 0 0 1 3.42 0l2.07 2.07a2.22 2.22 0 0 1 0 3.42l-9.92 9.92a2.22 2.22 0 0 1-1.34.64l-2.6.45a.91.91 0 0 1-1.07-1.07l.45-2.6a2.22 2.22 0 0 1 .64-1.34L10.29 2.22z">
                </path>
                <path d="m14 6 2 2"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Chip Navigation -->
    <div class="chips">
      <button class="chip active" id="btn-year" onclick="switchMode('year')">
        Year 2026
      </button>
      <button class="chip" id="btn-hsc" onclick="switchMode('hsc')">
        HSC '26
      </button>
    </div>

    <!-- Content Area -->
    <div class="content">
      <h1 id="label-text">Loading...</h1>
      <p id="date-display"></p>

      <!-- Progress Bar (Year mode) -->
      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <!-- Countdown (HSC mode) -->
      <div class="countdown" id="countdown" style="display: none">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
